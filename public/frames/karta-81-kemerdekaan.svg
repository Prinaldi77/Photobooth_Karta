<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <style>
      .font-heavy { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; }
      .font-script { font-family: 'Brush Script MT', 'Segoe Script', cursive; }
      .font-mono { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
  </defs>

  <!-- BACKGROUND OVERLAY DENGAN CUT-OUT HOLES (EVENODD FILL RULE) -->
  <!-- Strip Kiri: Background Cream/Putih dengan 3 Lubang Transparan (x=70, w=460, h=340) -->
  <path fill="#F8FAFC" fill-rule="evenodd" d="
    M 0,0 H 600 V 1800 H 0 Z 
    M 70,520 H 530 V 860 H 70 Z 
    M 70,890 H 530 V 1230 H 70 Z 
    M 70,1260 H 530 V 1600 H 70 Z
  " />

  <!-- Strip Kanan: Background Cobalt Blue Karang Taruna dengan 3 Lubang Transparan (x=670, w=460, h=340) -->
  <path fill="#0052FF" fill-rule="evenodd" d="
    M 600,0 H 1200 V 1800 H 600 Z 
    M 670,100 H 1130 V 440 H 670 Z 
    M 670,470 H 1130 V 810 H 670 Z 
    M 670,840 H 1130 V 1180 H 670 Z
  " />

  <!-- Garis Pemisah Tengah (Cut Line) -->
  <line x1="600" y1="0" x2="600" y2="1800" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="12 8" />

  <!-- ==================== STRIP KIRI (KONTEN ATAS) ==================== -->
  <!-- Badge Kemerdekaan Kiri Atas -->
  <g transform="translate(70, 70)">
    <circle cx="20" cy="20" r="16" fill="#E11D48" />
    <circle cx="20" cy="20" r="8" fill="#FFFFFF" />
    <rect x="50" y="8" width="55" height="12" rx="3" fill="#E11D48" />
    <rect x="50" y="20" width="55" height="12" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <line x1="120" y1="20" x2="390" y2="20" stroke="#0052FF" stroke-width="3" />
    <text x="410" y="26" fill="#0052FF" class="font-heavy" font-size="24">81.0</text>
  </g>

  <!-- Tipografi EVERY merdeka. MOMENT (Kiri) -->
  <text x="70" y="200" fill="#0052FF" class="font-heavy" font-size="64" letter-spacing="-2">EVERY</text>
  <text x="140" y="245" fill="#E11D48" class="font-script" font-size="70">merdeka.</text>
  <text x="70" y="310" fill="#0052FF" class="font-heavy" font-size="64" letter-spacing="-2">MOMENT</text>

  <!-- Barcode Box (Kiri) -->
  <g transform="translate(70, 350)">
    <rect x="0" y="0" width="460" height="75" fill="#0052FF" rx="8" />
    <!-- Barcode lines -->
    <path d="M20 12 h8 v42 h-8 z M34 12 h4 v42 h-4 z M44 12 h12 v42 h-12 z M62 12 h6 v42 h-6 z M74 12 h14 v42 h-14 z M94 12 h6 v42 h-6 z M106 12 h10 v42 h-10 z M122 12 h4 v42 h-4 z M132 12 h14 v42 h-14 z M152 12 h8 v42 h-8 z M166 12 h4 v42 h-4 z M176 12 h16 v42 h-16 z M198 12 h6 v42 h-6 z M210 12 h12 v42 h-12 z M228 12 h4 v42 h-4 z M238 12 h14 v42 h-14 z M258 12 h6 v42 h-6 z M270 12 h10 v42 h-10 z M286 12 h4 v42 h-4 z M296 12 h14 v42 h-14 z M316 12 h8 v42 h-8 z M330 12 h4 v42 h-4 z M340 12 h16 v42 h-16 z M362 12 h6 v42 h-6 z M374 12 h12 v42 h-12 z M392 12 h4 v42 h-4 z M402 12 h14 v42 h-14 z M422 12 h6 v42 h-6 z M434 12 h8 v42 h-8 z" fill="#FFFFFF" />
    <text x="230" y="66" fill="#FFFFFF" class="font-mono" font-size="10" text-anchor="middle" letter-spacing="2">17.08.1945 // 17.08.2026 // KARTA EDITION</text>
  </g>

  <!-- Stiker Pita Merah Putih di Sudut Foto 1 Kiri -->
  <g transform="translate(420, 500) rotate(25)">
    <rect x="0" y="0" width="110" height="15" fill="#E11D48" />
    <rect x="0" y="15" width="110" height="15" fill="#FFFFFF" />
  </g>

  <!-- ==================== STRIP KANAN (KONTEN BAWAH) ==================== -->
  <!-- Tipografi EVERY merdeka. MOMENT (Kanan) -->
  <text x="670" y="1320" fill="#FFFFFF" class="font-heavy" font-size="64" letter-spacing="-2">EVERY</text>
  <text x="740" y="1365" fill="#E11D48" class="font-script" font-size="70">merdeka.</text>
  <text x="670" y="1430" fill="#FFFFFF" class="font-heavy" font-size="64" letter-spacing="-2">MOMENT</text>

  <!-- Barcode Box (Kanan) -->
  <g transform="translate(670, 1470)">
    <rect x="0" y="0" width="460" height="75" fill="#FFFFFF" rx="8" />
    <path d="M20 12 h8 v42 h-8 z M34 12 h4 v42 h-4 z M44 12 h12 v42 h-12 z M62 12 h6 v42 h-6 z M74 12 h14 v42 h-14 z M94 12 h6 v42 h-6 z M106 12 h10 v42 h-10 z M122 12 h4 v42 h-4 z M132 12 h14 v42 h-14 z M152 12 h8 v42 h-8 z M166 12 h4 v42 h-4 z M176 12 h16 v42 h-16 z M198 12 h6 v42 h-6 z M210 12 h12 v42 h-12 z M228 12 h4 v42 h-4 z M238 12 h14 v42 h-14 z M258 12 h6 v42 h-6 z M270 12 h10 v42 h-10 z M286 12 h4 v42 h-4 z M296 12 h14 v42 h-14 z M316 12 h8 v42 h-8 z M330 12 h4 v42 h-4 z M340 12 h16 v42 h-16 z M362 12 h6 v42 h-6 z M374 12 h12 v42 h-12 z M422 12 h6 v42 h-6 z M434 12 h8 v42 h-8 z" fill="#0052FF" />
    <text x="230" y="66" fill="#0052FF" class="font-mono" font-size="10" text-anchor="middle" letter-spacing="2">17.08.1945 // 17.08.2026 // KARTA EDITION</text>
  </g>

  <!-- Badge Kemerdekaan Kanan Bawah -->
  <g transform="translate(670, 1620)">
    <circle cx="20" cy="20" r="16" fill="#E11D48" />
    <circle cx="20" cy="20" r="8" fill="#FFFFFF" />
    <rect x="50" y="8" width="55" height="12" rx="3" fill="#E11D48" />
    <rect x="50" y="20" width="55" height="12" rx="3" fill="#FFFFFF" />
    <line x1="120" y1="20" x2="390" y2="20" stroke="#FFFFFF" stroke-width="3" />
    <text x="410" y="26" fill="#FFFFFF" class="font-heavy" font-size="24">81.0</text>
  </g>

  <!-- Stempel Rubber Special Edition Bulat (Kanan Bawah) -->
  <g transform="translate(1000, 1420) rotate(-12)">
    <circle cx="45" cy="45" r="42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 3" />
    <circle cx="45" cy="45" r="35" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <text x="45" y="32" fill="#FFFFFF" class="font-heavy" font-size="9" text-anchor="middle">HUT RI KE-81</text>
    <text x="45" y="47" fill="#E11D48" class="font-heavy" font-size="11" text-anchor="middle">EDISI SPESIAL</text>
    <text x="45" y="60" fill="#FFFFFF" class="font-mono" font-size="8" text-anchor="middle">KARANG TARUNA</text>
  </g>
</svg>
